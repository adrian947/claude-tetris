<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">TOP 5</span>
          <ol id="highscore-list" class="highscore-list"></ol>
          <div class="highscore-stats">
            <span>Mejor combo: <strong id="best-combo-ever">0</strong></span>
            <span>Máx. líneas: <strong id="max-lines-ever">0</strong></span>
          </div>
          <button id="reset-highscores-btn" type="button">Resetear récords</button>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" type="button">🌙 Oscuro</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="overlay-highscore-entry" class="hidden">
          <p class="highscore-qualify-msg">¡Nueva puntuación entre las mejores!</p>
          <input id="player-name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="submit-score-btn" type="button">Guardar</button>
        </div>

        <ol id="overlay-highscore-list" class="highscore-list hidden"></ol>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <span class="version">v2.0.0</span>

  <script src="game.js"></script>
</body>
</html>
